# Apache vhost in front of the g0no container (see specs/deploy.md).
# Replace g0no.example.org with the public host name. Install as
# /etc/apache2/sites-available/<host>.conf and enable with a2ensite.
<VirtualHost *:80>
	ServerName g0no.example.org
	# The globally enabled PageSpeed module serves corrupt zstd-encoded assets
	# for this proxied app, without a Content-Encoding header. Keep it off here.
	<IfModule pagespeed_module>
		ModPagespeed off
	</IfModule>
	RewriteEngine On
	RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
	RewriteRule ^ https://g0no.example.org%{REQUEST_URI} [R=301,L]
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
	ServerName g0no.example.org
	# The globally enabled PageSpeed module serves corrupt zstd-encoded assets
	# for this proxied app, without a Content-Encoding header. Keep it off here.
	<IfModule pagespeed_module>
		ModPagespeed off
	</IfModule>
	SSLEngine on
	SSLCertificateFile /etc/letsencrypt/live/g0no.example.org/fullchain.pem
	SSLCertificateKeyFile /etc/letsencrypt/live/g0no.example.org/privkey.pem
	Protocols h2 http/1.1
	ErrorLog ${APACHE_LOG_DIR}/g0no.example.org-error.log
	CustomLog ${APACHE_LOG_DIR}/g0no.example.org-access.log combined

	ProxyRequests Off
	ProxyPreserveHost On
	ProxyTimeout 60
	RequestHeader set X-Forwarded-Proto "https"
	ProxyPass /.well-known/acme-challenge/ !
	# upgrade=websocket (Apache 2.4.47+) passes the Action Cable WebSocket
	# at /cable through for live updates (specs/live-updates.md).
	ProxyPass / http://127.0.0.1:3182/ retry=0 upgrade=websocket
	ProxyPassReverse / http://127.0.0.1:3182/
</VirtualHost>
</IfModule>
